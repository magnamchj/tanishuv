name: tanishuv
description: "Tanishuv"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.4.4
  image_picker:
  firebase_messaging: ^15.1.3
  flutter_local_notifications:
  badges:
  permission_handler:
  google_fonts: ^6.3.3

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  emoji_picker_flutter: ^4.4.0
  audioplayers: ^6.5.1
  record: ^6.1.2
  video_player: ^2.10.1
  chewie: ^1.13.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  flutter_card_swiper: ^7.2.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  shared_preferences: ^2.3.2
  geolocator: ^13.0.2
  image_cropper: ^8.0.2
  flutter_animate: ^4.5.2
  flutter_slidable: ^4.0.3
  swipe_to: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/
