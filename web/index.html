<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tanishuv</title>

  <script>
    function getParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    const ref = getParam("ref") || "";
    const appLink = ref
      ? `tanishuv://invite?ref=${ref}`
      : `tanishuv://`;

    const iosStore = "https://apps.apple.com/app/6765862602";
    const androidStore = "https://play.google.com/store/apps/details?id=com.tanishuv.uz";

    function openApp() {
      const start = Date.now();

      // Try to open app
      window.location.href = appLink;

      setTimeout(() => {
        const elapsed = Date.now() - start;

        // If app opened → browser pauses → elapsed will be large
        if (elapsed < 2000) {
          const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          if (isIOS) {
            window.location.href = iosStore;
          } else {
            window.location.href = androidStore;
          }
        }
      }, 2500); // longer delay
    }

    window.onload = openApp;
  </script>
</head>

<body
  style="background:#0f0f0f;color:white;text-align:center;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">

  <div>
    <h1>🔥 Join Tanishuv</h1>
    <p>Opening app...</p>
  </div>

</body>

</html>
